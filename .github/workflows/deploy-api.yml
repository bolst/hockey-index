name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - src/api/**
      - deploy/docker/**
      - deploy/compose*.yaml
      - deploy/scripts/deploy.sh
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src/api
          file: deploy/docker/api.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/hockey-index-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: src/api
          file: deploy/docker/migrator.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/hockey-index-migrator:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,scope=migrator,mode=max

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy over the forced command
        env:
          TAG: ${{ needs.build.outputs.tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "deploy@$DEPLOY_HOST" "staging $TAG"

  smoke:
    needs: staging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    env:
      E2E_BASE_URL: ${{ vars.STAGING_WEB_URL }}
      E2E_API_URL: ${{ vars.STAGING_API_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @smoke --config e2e/playwright.config.ts

  production:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over the forced command
        env:
          TAG: ${{ needs.build.outputs.tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "deploy@$DEPLOY_HOST" "prod $TAG"
