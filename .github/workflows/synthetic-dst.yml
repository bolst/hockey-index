name: synthetic-dst

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node deploy/scripts/synthetic-dst.mjs
        env:
          DST_FIXTURE_EVENT_ID: ${{ vars.DST_FIXTURE_EVENT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          API_URL: ${{ vars.API_URL }}
